<style>
/* Layout: Sunday sports section. Centered slab-serif nameplate over a double rule, black ticker, hash-routed pages on newsprint white. Single light look by choice. */
:root{
  --bg:#fbfbf9; --panel:#ffffff; --tint:#f2f2ee; --line:#d9d9d4; --ink-line:#141414;
  --fg:#141414; --soft:#3b3b3b; --dim:#6b6b6b; --red:#c2410c; --gold:#8a6200; --green:#1f7a43;
  --display:"Alfa Slab One","Rockwell","Roboto Slab",Georgia,serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#0b3b38}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.mast{background:linear-gradient(100deg,#0b3b38 0%,#0f766e 45%,#0d9488 72%,#14b8a6 100%);color:#fff;border-bottom:3px double var(--ink-line)}
.mast .wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:18px 10px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:#fff;width:100%;container-type:inline-size}
.brand-name{position:relative;display:grid;place-items:center;width:100%;padding-block:clamp(14px,4cqi,40px) clamp(8px,2cqi,20px)}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:118%;width:auto;aspect-ratio:1;opacity:.22;pointer-events:none;filter:none}
.badge{position:relative;display:block;width:100%;font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:11cqi;line-height:1.3;color:#fff;text-align:center;white-space:nowrap;letter-spacing:0;transform:rotate(-3deg);text-shadow:0 3px 0 #0b3b38,0 6px 14px rgba(0,0,0,.35)}
.brand-txt{display:flex;align-items:center;gap:10px;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:4px;text-transform:uppercase}
@media (max-width:520px){.brand-txt{letter-spacing:2px;font-size:10.5px;text-align:center}.brand-txt::before,.brand-txt::after{width:16px}}
.brand-txt::before,.brand-txt::after{content:"";width:34px;height:1px;background:rgba(255,255,255,.7)}
.dot{display:none}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 4px;border-top:1px solid rgba(255,255,255,.3);padding-top:8px;width:100%}
nav a{text-decoration:none;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.85);padding:4px 10px}
nav a:hover,nav a:focus-visible{color:#fff;outline:none;background:rgba(0,0,0,.12)}
nav a[aria-current="page"]{color:#fff;box-shadow:inset 0 -2px 0 #fff}

.ticker{background:var(--ink-line);overflow:hidden;white-space:nowrap}
.ticker .wrap{display:flex;align-items:center;gap:14px;padding-block:8px}
.tag{flex:none;background:var(--red);color:#fff;font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2px;padding:3px 8px;text-transform:uppercase}
.track{overflow:hidden;flex:1;min-width:0}
.run{display:inline-flex;gap:34px;padding-right:34px;font-family:var(--mono);font-size:12.5px;color:#b9b9b4}
.run b{color:#fff;font-weight:500}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-50%)}}


.stamp{font-family:var(--mono);font-size:12px;color:var(--dim);padding-block:14px 0;text-align:center}
main{padding-block:6px 10px}
.page[hidden]{display:none}
.sec{padding-block:24px 6px}
.sec-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:2px solid var(--ink-line);margin-bottom:18px;padding-bottom:6px}
.sec-head h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.sec-head p{margin:0;color:var(--dim);font-size:13px}
.kicker{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--red)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4.6vw,50px);line-height:1.06;margin:8px 0 12px;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
.dek{color:var(--soft);font-size:18px;max-width:62ch;margin:0 0 14px}
.prose p{max-width:68ch;margin:0 0 14px;color:var(--soft);font-size:16px}
.prose p:first-child{color:var(--fg)}
.prose p:first-child::first-letter{font-family:var(--display);color:var(--red);float:left;font-size:3.2em;line-height:.82;margin:.08em .1em 0 0}
@supports (initial-letter:2) or (-webkit-initial-letter:2){.prose p:first-child::first-letter{float:none;font-size:inherit;line-height:inherit;margin:0 .12em 0 0;-webkit-initial-letter:2;initial-letter:2}}

.lead{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px;padding-top:18px}
.hero{border-bottom:1px solid var(--line);padding-bottom:20px;min-width:0}
.more{display:inline-block;margin-top:4px;font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--red);text-decoration:none}
.more:hover{text-decoration:underline}
.wire{border-left:1px solid var(--line);padding-left:22px;min-width:0}
.wire h2{margin:0 0 4px;padding-bottom:6px;font-family:var(--display);font-weight:400;font-size:20px;border-bottom:2px solid var(--ink-line)}
.wire ul{list-style:none;margin:0;padding:0}
.wire li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--soft)}
.wire li:last-child{border-bottom:0}
.wire li a{display:block;margin-top:3px;font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none}
.wire li a:hover{color:var(--red);text-decoration:underline}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.item{border-top:1px solid var(--ink-line);padding-top:12px;min-width:0}
.item p{margin:0;color:var(--soft)}
.item .more{margin-top:8px}
.meta{margin-top:8px;font-family:var(--mono);font-size:12px;color:var(--dim)}

.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);padding:6px 10px;border-bottom:1px solid var(--ink-line);white-space:nowrap}
table.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tbody tr:nth-child(even){background:var(--tint)}
table.t .num{font-family:var(--mono);white-space:nowrap}
table.t .rk{font-family:var(--display);font-size:22px;width:44px;color:var(--red)}
table.t .tm{font-weight:700;white-space:nowrap}
table.t .tm a{text-decoration:none}
table.t .tm a:hover{color:var(--red);text-decoration:underline}
table.t .own{display:block;font-weight:400;font-size:12px;color:var(--dim)}
table.t .take{color:var(--soft);font-size:14px;min-width:240px}
.mv{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.up{color:var(--green)} .dn{color:var(--red)} .eq{color:var(--dim)}

.week{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:0 18px;border-top:1px solid var(--line);padding-block:14px}
.week .wk{font-family:var(--display);font-size:36px;line-height:1.15;color:var(--red)}
.week .wk small{display:block;font-family:var(--body);font-weight:800;font-size:10px;line-height:1.4;letter-spacing:2px;color:var(--dim);margin-bottom:4px}
.week h4{margin:0 0 3px;font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.week .c1 h4{color:var(--fg)} .week .c2 h4{color:var(--gold)} .week .c3 h4{color:var(--red)}
.week p{margin:0;font-size:14px;color:var(--soft)}
.week > div{min-width:0}

.teams{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tcard{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ink-line);padding:14px 16px;min-width:0;transition:border-color .15s}
.tcard:hover,.tcard:focus-visible{border-top-color:var(--red);outline:none}
.tcard b{display:block;font-family:var(--display);font-weight:400;font-size:18px;line-height:1.15;overflow-wrap:anywhere;margin-bottom:4px}
.tcard span{font-size:12px;color:var(--dim)}
.tcard .num{font-family:var(--mono);color:var(--fg)}
.tpage{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:28px}
.facts{border:1px solid var(--line);border-top:3px solid var(--ink-line);background:var(--panel)}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14px}
.facts div:last-child{border-bottom:0}
.facts span:first-child{color:var(--dim)}
.facts .num{font-family:var(--mono);text-align:right}
.facts h4{margin:0;padding:10px 14px;font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--tint)}
.facts ul{margin:0;padding:8px 14px 10px 30px;font-size:14px;color:var(--soft)}
.back{font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);text-decoration:none}
.back:hover{color:var(--red)}

.rumor{background:var(--panel);border:1px solid var(--line);padding:14px 16px;min-width:0}
.rumor .src{font-family:var(--body);font-weight:800;font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase}
.rumor p{margin:6px 0 0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;color:var(--fg)}
.disclaim{margin:14px 0 0;font-size:12px;color:var(--dim)}

.deal{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--ink-line);min-width:0}
.deal .sides{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr)}
.deal .s{padding:14px 16px;min-width:0}
.deal .team{font-family:var(--display);font-size:16px;line-height:1.2;overflow-wrap:anywhere}
.deal .team a{text-decoration:none}
.deal .team a:hover{color:var(--red)}
.deal .rcv{margin-top:8px;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.deal .gets{list-style:none;margin:4px 0 0;padding:0;font-weight:700;font-size:16px;line-height:1.35}
.deal .swap{display:flex;align-items:center;justify-content:center;background:var(--tint);color:var(--red);border-inline:1px solid var(--line);font-size:20px}
.deal .why{border-top:1px solid var(--line);padding:12px 16px;color:var(--soft);font-size:14px}
.deal.bad{border-top-color:var(--red);background:repeating-linear-gradient(135deg,var(--panel) 0 14px,#fdf4ef 14px 28px)}
.deal.bad .verdict{background:var(--red);color:#fff}
.exits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}
.exit{border-top:1px solid var(--line);padding:12px 0;min-width:0}
.exit b{font-family:var(--display);font-weight:400;font-size:18px}
.exit .tm{display:block;font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin:2px 0 4px}
.exit .tm a{text-decoration:none}
.exit p{margin:0;color:var(--soft);font-size:14px}
@media (max-width:640px){.exits{grid-template-columns:1fr}}
.verdict{display:inline-block;margin-top:8px;font-family:var(--body);font-weight:800;font-size:10.5px;letter-spacing:2px;text-transform:uppercase;padding:2px 8px;border:1px solid var(--red);color:var(--red)}

.seat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.list{border:1px solid var(--line);background:var(--panel);min-width:0}
.list h3{margin:0;padding:12px 16px;font-size:20px;border-bottom:2px solid var(--ink-line)}
.list.hot h3{color:var(--red)}
.list.try h3{color:var(--gold)}
.list ol{margin:0;padding:0;list-style:none}
.list li{padding:12px 16px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list li b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.list li b a{text-decoration:none}
.list li span{color:var(--soft);font-size:14px}

.line{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,84px);gap:0 12px;align-items:start;border-top:1px solid var(--line);padding-block:14px}
.line .match b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.15}
.line .match b a{text-decoration:none}
.line .match span{display:block;color:var(--dim);font-size:14px}
.line .match p{margin:6px 0 0;color:var(--soft);font-size:14px}
.line .mk{text-align:center;background:var(--tint);border:1px solid var(--line);padding:8px 4px}
.line .mk small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.line .mk b{font-family:var(--mono);font-size:18px}

.sources{margin-top:28px;font-size:13px;color:var(--dim)}
.sources a{color:var(--soft)}
footer{margin-top:30px;border-top:3px double var(--ink-line)}
footer .wrap{padding-block:18px;color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

.byline{display:flex;align-items:center;gap:12px;margin:10px 0 16px}
.byline img{width:56px;height:56px;border-radius:50%;flex:none}
.byline b{display:block;font-weight:800;font-size:15px}
.byline span{font-size:13px;color:var(--dim)}
.cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.col{display:flex;flex-direction:column;gap:8px;text-decoration:none;border-top:3px solid var(--ink-line);padding-top:14px;min-width:0}
.col:hover h3,.col:focus-visible h3{color:var(--red)}
.col img{width:72px;height:72px;border-radius:50%}
.col .who{font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.col p{margin:0;color:var(--soft);font-size:14px}
.staff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:8px}
.staffer{display:flex;gap:14px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.staffer img{width:64px;height:64px;border-radius:50%;flex:none}
.staffer b{display:block;font-family:var(--display);font-weight:400;font-size:17px;line-height:1.2}
.staffer small{display:block;font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);margin:2px 0 4px}
.staffer p{margin:0;font-size:14px;color:var(--soft)}
@media (max-width:900px){.cols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.cols,.staff{grid-template-columns:1fr}}
.mgr{color:var(--red);font-weight:700}
.tmn,table.t .tm a,.deal .team a,.list li b a,.line .match b a,.exit .tm a{color:#1e3a8a}
.tmn{font-weight:700}
td.pk{font-size:13px;color:var(--soft);min-width:9ch}
.win{display:inline-block;font-weight:800;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.win.contend{color:var(--green)} .win.rebuild{color:var(--red)} .win.purgatory,.win.stuck{color:var(--gold)} .win.allin{color:#7c3aed}
.legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--dim);padding-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

.pay{display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1.4fr) auto;gap:4px 16px;align-items:start;border-top:1px solid var(--line);padding-block:12px}
.pay .wk{font-family:var(--display);font-size:28px;line-height:1.15;color:var(--red)}
.pay .wk small{display:block;font-family:var(--body);font-weight:800;font-size:10px;line-height:1.4;letter-spacing:2px;color:var(--dim);margin-bottom:3px}
.pay .cat{font-weight:700;font-size:15px}
.pay .who{font-size:14px;color:var(--soft)}
.pay .who b{display:block;font-size:15px}
.st{font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--line);white-space:nowrap;color:var(--dim);align-self:start;justify-self:end}
.st.paid{background:#0f766e;border-color:#0f766e;color:#fff}
.st.live{background:var(--red);border-color:var(--red);color:#fff}
.st.ruling{border-color:var(--red);color:var(--red)}
.pay.now{background:#fff7ed}
.shot{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;background:#141414;color:#fff;border-top:4px solid #d97706;padding:18px 20px}
.shot .can{font-family:var(--display);font-size:44px;line-height:1;color:#d97706;text-align:center;min-width:72px}
.shot .can small{display:block;font-family:var(--body);font-weight:800;font-size:10px;letter-spacing:2px;color:#bbb;margin-top:4px}
.shot .lbl{font-weight:800;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#d97706}
.shot h3{margin:4px 0 2px;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.2}
.shot h3 a,.shot .tm a{color:#fff}
.shot p{margin:6px 0 0;color:#ddd;font-size:14px}
.shot + .more{display:inline-block;margin-top:12px}
.shot .tmn{color:#93c5fd}.shot .mgr{color:#fdba74}
.shot .next{margin-top:8px;font-size:12px;color:#aaa}
.foam{width:100%;border-collapse:collapse;margin-top:6px}
.foam th{text-align:left;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);border-bottom:2px solid var(--ink-line);padding:6px 8px}
.foam td{border-bottom:1px solid var(--line);padding:9px 8px;vertical-align:top;font-size:14px}
.foam td.num{font-family:var(--mono);white-space:nowrap}
.foam tr.low td{background:#fff4e5}

  var MARK=null;
  function buildMark(){
    var esc2=function(x){return x.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");};
    var teams=D.teams.map(function(t){return t.name;});
    var extra=D.aliases||["Pudge","SadPudge","Chuck","Tyler(?! (?:Shough|Warren|Higbee|Allgeier|Huntley|Goodson|Lockett|Boyd|Conklin|Johnson))","codywomack90","TroyMcCoy","RammerJammer17","ztw129","TStark7","paragoody15"];
    var users=D.standings.map(function(r){return esc2(r[1]);}).concat(extra.map(function(x){return /[(?]/.test(x)?x:esc2(x);}));
    var tAlt=teams.map(esc2).sort(function(a,b){return b.length-a.length;}).join("|");
    var uAlt=users.sort(function(a,b){return b.length-a.length;}).join("|");
    MARK=new RegExp("(^|[^A-Za-z0-9_])(?:("+tAlt+")|("+uAlt+"))(?![A-Za-z0-9_])","g");
  }
  function mark(root){
    if(!MARK) buildMark();
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), nodes=[], n;
    while((n=w.nextNode())){ if(n.parentNode.closest && (n.parentNode.closest(".mgr,.tmn,script,style")||(n.parentNode.closest("a")&&!n.parentNode.closest("a.pk,a.tsr,a.tsc,a.desk,a.jt,a.tb,a.hl,a.mc")))) continue; nodes.push(n); }
    nodes.forEach(function(node){
      var t=node.nodeValue; MARK.lastIndex=0; if(!MARK.test(t)) return; MARK.lastIndex=0;
      var frag=document.createDocumentFragment(), last=0, m;
      while((m=MARK.exec(t))){
        var start=m.index+m[1].length, word=m[2]||m[3];
        frag.appendChild(document.createTextNode(t.slice(last,start)));
        var sp=document.createElement("span"); sp.className=m[2]?"tmn":"mgr"; sp.textContent=word; frag.appendChild(sp);
        last=start+word.length; MARK.lastIndex=last;
      }
      frag.appendChild(document.createTextNode(t.slice(last)));
      node.parentNode.replaceChild(frag,node);
    });
  }

    if(Y.taxi&&Y.taxi.length) h+='<div class="sec">'+head("Taxi Squad Watch",Y.taxiNote)+'<div class="grid">'+Y.taxi.map(function(x){return '<div class="item"><div class="kicker">'+esc(x.tag)+'</div><h3>'+esc(x.p)+'</h3><p>'+esc(x.t)+'</p></div>';}).join("")+'</div></div>';
    return h;
  }
  var pages=["projections","home","recap","rankings","teams","team","rumors","trades","history","lines","story","opinion","col","payouts","shotgun","hof","commish","rip","dynasty"];
  function route(){
    if(!D) return;
    var h=(location.hash||"#home").slice(1), view=h, arg=null;
    if(h.indexOf("team-")===0){view="team";arg=h.slice(5);}
    else if(h.indexOf("story-")===0){view="story";arg=h.slice(6);}
    else if(h.indexOf("col-")===0){view="col";arg=h.slice(4);}
    if(view==="history") view="hof";
    var openKey=null;
    if(view==="team"){openKey=arg;view="rankings";}
    if(view==="teams") view="rankings";
    if(view==="shotgun") view="payouts";
    if(view==="lines") view="home";
    if(pages.indexOf(view)<0) view="home";
    var html={home:home,recap:recap,rankings:function(){return rankings(openKey);},teams:teams,team:function(){return team(arg);},rumors:rumors,trades:trades,history:history,lines:lines,story:function(){return story(arg);},opinion:opinion,col:function(){return column(arg);},payouts:function(){return payouts()+shotgun();},projections:projections,shotgun:shotgun,hof:hof,commish:home,rip:ring,dynasty:dynasty}[view]();
    pages.forEach(function(p){var el=document.getElementById("p-"+p);el.hidden=(p!==view);if(p===view){ el.innerHTML=html; try{ mark(el); }catch(e){} }});
    var navKey=view==="team"?"teams":view==="story"?"home":view==="col"?"home":view;
    document.querySelectorAll("#nav a").forEach(function(a){if(a.getAttribute("href")==="#"+navKey) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");});
    window.scrollTo(0,0);
    if(view==="home") setTimeout(startFx,0); else stopFx();
    if(openKey){var dt=document.getElementById("rk-"+openKey);if(dt){dt.open=true;setTimeout(function(){dt.scrollIntoView({block:"start"});},30);}}
  }
  function boot(data){
    D=data;
    document.getElementById("stamp").textContent="Updated "+D.updated;
    var items;
    if(D.lines&&D.lines.length&&D.lines[0].prob!=null){
      document.getElementById("tickTag").textContent="Wk "+D.week+" · Win Prob";
      items=D.lines.map(function(l){return '<span><b>'+esc(l.fav)+' '+l.prob+'%</b> vs '+esc(l.dog)+' '+(100-l.prob)+'% · '+(l.spread==="PK"?"Pick&#39;em":esc(l.spread))+'</span>';}).join("");
    } else {
      document.getElementById("tickTag").textContent="Wk "+(D.week-1)+" Final";
      items=D.ticker.map(function(t){return '<span><b>'+esc(t[0])+' '+esc(t[1])+'</b> · '+esc(t[2])+' '+esc(t[3])+'</span>';}).join("");
    }
    [["payouts",D.payouts],["shotgun",D.shotgun],["commish",D.commish],["rip",D.ring&&D.ring.banners&&D.ring.banners.length],["dynasty",D.dyn]].forEach(function(x){if(!x[1]){var a=document.querySelector('#nav a[href="#'+x[0]+'"]');if(a)a.remove();}});
    document.getElementById("run").innerHTML=items+items;
    (function(){var tr=document.querySelector(".ticker .track"),rn=document.getElementById("run"),x=0,t0=null;if(!tr||!rn||!window.requestAnimationFrame)return;function tick(t){if(t0!==null){x+=Math.min(t-t0,100)*0.045;var half=rn.scrollWidth/2;if(half>0&&x>=half)x-=half;tr.scrollLeft=Math.round(x);}t0=t;requestAnimationFrame(tick);}requestAnimationFrame(tick);})();
    var src='<div class="sources">Sources: '+D.sources.map(function(s){return '<a href="'+esc(s[1])+'" target="_blank" rel="noopener">'+esc(s[0])+'</a>';}).join(" · ")+'</div>';
    document.querySelector("footer").insertAdjacentHTML("beforebegin",'<div class="wrap">'+src+'</div>');
    route();
  }
  document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("[data-car]");if(!b)return;var c=document.getElementById("car");if(!c)return;var card=c.querySelector(".mc");var step=card?card.getBoundingClientRect().width+16:300;c.scrollBy({left:step*parseInt(b.getAttribute("data-car"),10),behavior:"smooth"});});
  window.addEventListener("hashchange",route);
  fetch("data.json",{cache:"no-store"}).then(function(r){if(!r.ok) throw new Error(r.status);return r.json();}).then(boot).catch(function(){
    document.getElementById("stamp").textContent="Couldn't load today's edition. Refresh the page to try again.";
  });
})();
</script>
<script>
(function(){var b=document.querySelector('.badge');if(!b)return;
function fit(){b.style.fontSize='';var r=document.createRange();r.selectNodeContents(b);var tw=r.getBoundingClientRect().width,bw=b.clientWidth;
if(tw>0&&bw>0){var fs=parseFloat(getComputedStyle(b).fontSize);b.style.fontSize=(fs*bw*0.94/tw)+'px';}}
fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);addEventListener('resize',fit);})();
</script>
